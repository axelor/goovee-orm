name: 'Setup'
description: 'Setup pnpm, Node.js, and install dependencies'
runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v6
      with:
        node-version: "22.x"
        registry-url: "https://registry.npmjs.org"
        cache: "pnpm"
    - name: Install dependencies
      shell: bash
      run: pnpm install
